services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-whatsapp_ai_commerce}
      POSTGRES_USER: ${DATABASE_USER:-whatsapp_ai_commerce}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-whatsapp_ai_commerce}
      DATABASE_USER: ${DATABASE_USER:-whatsapp_ai_commerce}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CATALOG_CURRENCY: ${CATALOG_CURRENCY:-MAD}
      CHECKOUT_REQUIRED_FIELDS: '${CHECKOUT_REQUIRED_FIELDS:-["customer_name","phone","city","address"]}'
      CHECKOUT_COUNTRY: ${CHECKOUT_COUNTRY:-MA}
      DELIVERY_POLICY: '${DELIVERY_POLICY:-{}}'
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-20}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-512}
      AI_HISTORY_MAX_MESSAGES: ${AI_HISTORY_MAX_MESSAGES:-12}
      AI_HISTORY_MAX_CHARS: ${AI_HISTORY_MAX_CHARS:-12000}
      AI_CLASSIFIER_MODEL: ${AI_CLASSIFIER_MODEL-gpt-4.1-nano}
      AI_CLASSIFIER_TIMEOUT_SECONDS: ${AI_CLASSIFIER_TIMEOUT_SECONDS:-8}
      AI_CLASSIFIER_MAX_OUTPUT_TOKENS: ${AI_CLASSIFIER_MAX_OUTPUT_TOKENS:-256}
      AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-2000}
      AI_INBOUND_PER_MINUTE: ${AI_INBOUND_PER_MINUTE:-10}
      AI_CUSTOMER_ATTEMPTS_PER_HOUR: ${AI_CUSTOMER_ATTEMPTS_PER_HOUR:-60}
      AI_CUSTOMER_ATTEMPTS_PER_DAY: ${AI_CUSTOMER_ATTEMPTS_PER_DAY:-200}
      AI_BUSINESS_ATTEMPTS_PER_DAY: ${AI_BUSINESS_ATTEMPTS_PER_DAY:-1000}
      AI_SPAM_THRESHOLD: ${AI_SPAM_THRESHOLD:-3}
      AI_SPAM_WINDOW_SECONDS: ${AI_SPAM_WINDOW_SECONDS:-60}
      AI_NOTICE_COOLDOWN_SECONDS: ${AI_NOTICE_COOLDOWN_SECONDS:-60}
      WHATSAPP_MAX_BODY_BYTES: ${WHATSAPP_MAX_BODY_BYTES:-1048576}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
